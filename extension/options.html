<!doctype html>
<meta charset="utf-8">
<title>Thalamus options</title>
<style>body{font:14px system-ui;margin:16px;max-width:480px}label{display:block;margin:12px 0 4px}input{width:100%;box-sizing:border-box;padding:6px}button{margin-top:12px;padding:6px 12px}#saved{margin-left:8px;color:#2a7}</style>
<h1>Thalamus</h1>
<p>The gateway of your organisation and the key it issued to you. Both stay in this browser.</p>
<label for="gateway">Gateway address</label>
<input id="gateway" placeholder="http://gateway.internal:8787">
<p><button id="signin">Sign in</button> <span id="signed" data-status=""></span></p>
<p>Sign in with the organisation's account: the gateway hands you your key. If the gateway has no identity provider, paste the key you were given.</p>
<label for="key">Your key</label>
<input id="key" type="password" autocomplete="off">
<button id="save">Save</button><span id="saved"></span>
<script type="module" src="options.js"></script>
