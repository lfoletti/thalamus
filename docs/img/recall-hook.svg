<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Automatic recall in Claude Code</title>
  <desc id="desc">The employee types a prompt. The th-hook of the plugin sends the prompt to th_recall on the Thalamus gateway, with the employee's key, and the gateway searches the server brains that the employee may read. Planned: the hook also searches the local brain on the machine. The best extracts are merged with their source, and the hook adds them to the prompt before the agent answers.</desc>
  <style>
    .box { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .core { fill: #312e81; stroke: #312e81; }
    .plan { stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { fill: none; stroke: #4338ca; stroke-width: 1.5; }
    .dash { fill: none; stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .head { fill: #4338ca; }
    .phead { fill: #6366f1; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e1b4b; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #4338ca; }
    .ptext { font-size: 12px; fill: #6366f1; font-style: italic; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e1b4b; stroke: #a5b4fc; }
      .core { fill: #4338ca; stroke: #a5b4fc; }
      .plan, .dash { stroke: #818cf8; }
      .line { stroke: #a5b4fc; }
      .head { fill: #a5b4fc; }
      .phead { fill: #818cf8; }
      text { fill: #e0e7ff; }
      .small { fill: #c7d2fe; }
      .ptext { fill: #a5b4fc; }
    }
  </style>

  <!-- Top row: the request, left to right -->
  <rect class="box" x="16" y="24" width="150" height="58" rx="8"/>
  <text class="label" x="91" y="49" text-anchor="middle">The employee</text>
  <text class="small" x="91" y="68" text-anchor="middle">types a prompt</text>

  <rect class="box" x="210" y="24" width="160" height="58" rx="8"/>
  <text class="label mono" x="290" y="49" text-anchor="middle">th-hook</text>
  <text class="small" x="290" y="68" text-anchor="middle">UserPromptSubmit</text>

  <rect class="box core" x="414" y="24" width="160" height="58" rx="8"/>
  <text class="label" x="494" y="49" text-anchor="middle" style="fill:#ffffff">Thalamus gateway</text>
  <text class="mono" x="494" y="68" text-anchor="middle" style="font-size:12px;fill:#c7d2fe">th_recall</text>

  <rect class="box" x="626" y="16" width="118" height="58" rx="8"/>
  <rect class="box" x="620" y="22" width="118" height="58" rx="8"/>
  <rect class="box" x="614" y="28" width="118" height="58" rx="8"/>
  <text class="label" x="673" y="53" text-anchor="middle">Server</text>
  <text class="label" x="673" y="71" text-anchor="middle">brains</text>

  <path class="line" d="M166 53 L 200 53"/><path class="head" d="M210 53 L 199 47.5 L 199 58.5 Z"/>
  <path class="line" d="M370 53 L 404 53"/><path class="head" d="M414 53 L 403 47.5 L 403 58.5 Z"/>
  <path class="line" d="M574 57 L 604 57"/><path class="head" d="M614 57 L 603 51.5 L 603 62.5 Z"/>
  <text class="small" x="494" y="100" text-anchor="middle">employee's key, readable brains only</text>

  <!-- Planned: the local brain on the machine -->
  <path class="dash" d="M290 82 L 290 128"/><path class="phead" d="M290 138 L 284.5 127 L 295.5 127 Z"/>
  <rect class="box plan" x="210" y="140" width="160" height="58" rx="8"/>
  <text class="label" x="290" y="165" text-anchor="middle">Local brain</text>
  <text class="ptext" x="290" y="184" text-anchor="middle">on the machine · planned</text>
  <path class="dash" d="M370 169 L 600 169 L 600 228"/><path class="phead" d="M600 238 L 594.5 227 L 605.5 227 Z"/>

  <!-- Down from the server brains -->
  <path class="line" d="M673 86 L 673 228"/><path class="head" d="M673 238 L 667.5 227 L 678.5 227 Z"/>

  <!-- Bottom row: the answer, right to left -->
  <rect class="box" x="540" y="240" width="204" height="58" rx="8"/>
  <text class="label" x="642" y="265" text-anchor="middle">Best extracts, merged</text>
  <text class="small" x="642" y="284" text-anchor="middle">each with brain, document, author</text>

  <rect class="box" x="278" y="240" width="214" height="58" rx="8"/>
  <text class="label" x="385" y="265" text-anchor="middle">Prompt + extracts</text>
  <text class="small" x="385" y="284" text-anchor="middle">added as context by the hook</text>

  <rect class="box" x="16" y="240" width="214" height="58" rx="8"/>
  <text class="label" x="123" y="265" text-anchor="middle">The agent answers</text>
  <text class="small" x="123" y="284" text-anchor="middle">and can open a source with th_get</text>

  <path class="line" d="M540 269 L 502 269"/><path class="head" d="M492 269 L 503 263.5 L 503 274.5 Z"/>
  <path class="line" d="M278 269 L 240 269"/><path class="head" d="M230 269 L 241 263.5 L 241 274.5 Z"/>

  <!-- Legend -->
  <path class="dash" d="M16 318 L 52 318"/>
  <text class="ptext" x="60" y="322">planned, not built yet</text>
</svg>
