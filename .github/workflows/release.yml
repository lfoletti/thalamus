name: release

# A tag v* builds the archives, creates a DRAFT release with them, and pushes
# the image ghcr.io/lfoletti/thalamus. The maintainer reads the draft and
# publishes it. A pull request that touches the release files builds
# everything and publishes nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - tools/release/**
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: build
        # A pull request has no tag: its ref name (N/merge) is not a version.
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-pr{0}', github.event.number) }}
        run: sh tools/release/build.sh "$VERSION" dist
      - name: the binaries name the release
        # -X ignores a symbol it does not find: a wrong import path would ship a release that says dev.
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-pr{0}', github.event.number) }}
        run: |
          tar -xzf "dist/thalamus_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          for cmd in th-gateway th-hook; do
            got=$("$RUNNER_TEMP/thalamus_${VERSION}_linux_amd64/$cmd" version)
            [ "$got" = "$cmd $VERSION" ] || { echo "$cmd version printed '$got', expected '$cmd $VERSION'" >&2; exit 1; }
          done
      - name: draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lfoletti/thalamus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-pr{0}', github.event.number) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
