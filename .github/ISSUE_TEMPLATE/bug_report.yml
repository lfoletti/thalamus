name: Bug report
description: Something in Thalamus does not work as the documentation says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps that show the problem. Remove keys and private data.
      placeholder: |
        1. rights.yaml with ...
        2. th-gateway serve ...
        3. th_recall with ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Thalamus commit or release, and the CortexDB version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Gateway or hook output. Remove keys and private data.
      render: text
